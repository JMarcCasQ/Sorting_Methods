<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Sorting Visualizer</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Ultimate Sorting Visualizer</h1>
        <div class="controls">
            <select id="algorithm">
                <option value="bubble">Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="insertion">Insertion Sort</option>
            </select>
            <select id="visualization">
                <option value="bars">Bar Graph</option>
                <option value="circles">Numbered Circles</option>
            </select>
            <button id="generate">Generate New</button>
            <button id="sort">Start Sorting</button>
            <span>Speed:</span>
            <input type="range" id="speed" min="10" max="200" value="100">
        </div>
        <div class="visualization"></div>
        <div id="info"></div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
